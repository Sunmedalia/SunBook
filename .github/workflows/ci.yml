name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go mod verify
      - name: Install ripgrep for workspace search tests
        shell: bash
        run: |
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - run: make smoke
      - name: Verify standalone release package
        shell: bash
        run: |
          version=$(go run ./cmd/sunbook --version | awk '{print $2}')
          target_os=$(go env GOOS)
          target_arch=$(go env GOARCH)
          package_dir=$(mktemp -d)
          trap 'rm -rf "$package_dir"' EXIT
          python3 scripts/package_release.py --version "$version" --os "$target_os" --arch "$target_arch" --output "$package_dir"
          python3 scripts/verify_release.py "$package_dir"/*.tar.gz
          tar -xzf "$package_dir/sunbook_${version}_${target_os}_${target_arch}.tar.gz" -C "$package_dir"
          cd "$package_dir"
          test "$(./sunbook --version)" = "SunBook $version"
          ./sunbook --config "$package_dir/config.json" --doctor
