name: Go
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ripgrep for workspace search tests
        shell: bash
        run: |
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ripgrep
            else
              sudo apt-get update
              sudo apt-get install -y ripgrep
            fi
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - run: make smoke
